<script>
        // Micro-interaction for the login button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            // Simplified loading state demonstration
            if (document.querySelector('form').checkValidity()) {
                e.preventDefault();
                loginBtn.innerHTML = `<span class="inline-block animate-spin mr-2"><span class="material-symbols-outlined !text-white">progress_activity</span></span> Verifying Account...`;
                loginBtn.style.opacity = '0.8';
                loginBtn.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    loginBtn.innerHTML = `<span class="material-symbols-outlined !text-white mr-2">check_circle</span> Success!`;
                    loginBtn.classList.remove('terracotta-gradient');
                    loginBtn.classList.add('bg-secondary');
                }, 1500);
            }
        });

        // Floating blobs parallax effect
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.background-blob');
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
