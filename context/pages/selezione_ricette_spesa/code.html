</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const recipeItems = document.querySelectorAll('.recipe-item');
            const checkboxes = document.querySelectorAll('.recipe-checkbox');
            const countLabel = document.getElementById('selected-count-label');
            const totalServingsLabel = document.getElementById('total-servings-label');

            function updateUI() {
                let selectedCount = 0;
                let totalServings = 0;

                recipeItems.forEach(item => {
                    const checkbox = item.querySelector('.recipe-checkbox');
                    const card = item.querySelector('.glass-card');
                    const selector = item.querySelector('.servings-selector');
                    const checkIcon = item.querySelector('.flex-1 div div.h-6');
                    const servingsCount = parseInt(item.querySelector('.servings-count').innerText);

                    if (checkbox.checked) {
                        selectedCount++;
                        totalServings += servingsCount;
                        card.classList.add('recipe-selected');
                        selector.classList.remove('hidden');
                        checkIcon.classList.add('bg-primary', 'text-on-primary');
                        checkIcon.classList.remove('bg-transparent', 'text-transparent', 'border-outline-variant');
                        checkIcon.classList.add('border-primary');
                    } else {
                        card.classList.remove('recipe-selected');
                        selector.classList.add('hidden');
                        checkIcon.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        checkIcon.classList.add('bg-transparent', 'text-transparent', 'border-outline-variant');
                    }
                });

                countLabel.innerText = `${selectedCount} ${selectedCount === 1 ? 'ricetta selezionata' : 'ricette selezionate'}`;
                totalServingsLabel.innerText = `${totalServings} ${totalServings === 1 ? 'porzione totale' : 'porzioni totali'}`;
            }

            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateUI);
            });

            // Prevent card toggle when clicking quantity buttons
            document.querySelectorAll('.servings-selector button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const countSpan = btn.parentElement.querySelector('.servings-count');
                    let current = parseInt(countSpan.innerText);
                    
                    if (btn.classList.contains('plus-btn')) {
                        current++;
                    } else if (btn.classList.contains('minus-btn') && current > 1) {
                        current--;
                    }
                    
                    countSpan.innerText = current;
                    updateUI();
                });
            });

            // Initial UI Sync
            updateUI();
        });
    </script>
